<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halka Browser</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Browser Chrome Header Area (Height: 80px) -->
  <header id="browser-chrome">
    
    <!-- Row 1: Tab Strip (36px) -->
    <div id="tab-strip">
      <div id="tab-list">
        <!-- Tab items rendered dynamically -->
      </div>
      <button id="btn-new-tab" class="tab-action-btn" title="New Tab (Ctrl+T)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- Row 2: Navigation Toolbar (44px) -->
    <div id="toolbar">
      <div class="nav-controls">
        <button id="btn-back" class="nav-btn" title="Back (Alt+Left)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <button id="btn-forward" class="nav-btn" title="Forward (Alt+Right)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
        <button id="btn-reload" class="nav-btn" title="Reload (Ctrl+R)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <button id="btn-home" class="nav-btn" title="Home Page">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </button>
      </div>

      <!-- Address / Search Bar Form -->
      <form id="address-bar-form">
        <div class="address-input-wrapper">
          <span class="security-badge" id="security-badge" title="HTTPS Secure Connection">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#10b981" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input 
            type="text" 
            id="address-input" 
            placeholder="Search with Google or enter web address" 
            autocomplete="off" 
            spellcheck="false"
          >
          <button type="button" id="btn-bookmark" class="action-btn" title="Bookmark Page (Ctrl+D)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" id="bookmark-icon">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </button>
          <button type="submit" id="btn-go" class="go-btn" title="Navigate">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </form>

      <div class="right-controls">
        <button id="btn-devtools" class="nav-btn" title="Developer Tools (Ctrl+Shift+I)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 18 22 12 16 6"/>
            <polyline points="8 6 2 12 8 18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Content Area Placeholder (Native Child Webviews mounted at y=80px) -->
  <main id="content-area">
  </main>

  <script src="js/chrome.js"></script>
</body>
</html>
