name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Halka Browser (Release)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package Windows Binary
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item src-tauri/target/release/halka_browser.exe dist/
          Compress-Archive -Path dist/* -DestinationPath Halka-Browser-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ${{ github.ref_name || 'v0.1.0' }}
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          draft: false
          prerelease: false
          files: |
            Halka-Browser-windows-x64.zip
            src-tauri/target/release/halka_browser.exe
