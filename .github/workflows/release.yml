name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Halka Browser & Installer
        run: npx @tauri-apps/cli build

      - name: Prepare Release Files
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" dist/
          Copy-Item src-tauri/target/release/halka_browser.exe dist/
          Compress-Archive -Path dist/* -DestinationPath Halka-Browser-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ${{ github.ref_name || 'v0.1.0' }}
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            Halka-Browser-windows-x64.zip
            src-tauri/target/release/halka_browser.exe
